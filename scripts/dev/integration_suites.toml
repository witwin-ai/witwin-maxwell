k/: symmetry_center, symmetry_pec_center, symmetry_pmc_center redefined as the kept half/quarter of the standard scene (kept_half), keyed and windowed by the mirrored domain with the Courant number of the mirrored twin: all 106 row keys byte-identical to master, the three rows hit their existing caches, no reference generated, WITWIN_BENCHMARK_NO_CLOUD=1 throughout. Benchmark movers (before -> after, field L2 / flux error): symmetry_center 0.1347/0.2853 FAIL -> 0.0203/0.0051 pass global; symmetry_pec_center 0.0674/0.1348 sentinel -> 0.0210/0.0050 pass global; symmetry_pmc_center 0.0674/0.1346 sentinel -> 0.0210/0.0050 pass global; their flux sentinel limits are retired. Core-path gate scene symmetry_pmc_center keeps its full-bounds definition (scene identical to master). Mode planes (separate commit, T2, user decision Refuse first, fix later (Recommended), 2026-11-12): ModeSource/ModeMonitor/ModePort/WavePort/TerminalWavePort whose mode plane touches an image plane (aperture reaches it or lies within half a cell, or the plane lies on it) are refused at construction (symmetry.mode_plane_image_plane), because the transverse mode solver is solved and unit-power normalized on the folded aperture with a zero edge at the image plane (PEC: n_eff 0.6 percent off and 2 W in the mirrored domain; PMC: wrong mode); no benchmark row, core-path gate scene or datagen builder combines a mode plane with symmetry (scan: only the three symmetry benchmark rows and the symmetry_pmc_center gate scene are symmetric, none has a mode plane), so no G1 rerun; PEC/PMC-aware mode operators (and ModeABC faces under symmetry, which use the same solver) are follow-ups. Audit (not fixed, reported): a Gaussian PointDipole normal to the image plane and wider than about half a cell is off (folded/twin 0.98 at width dx/2, 0.62 at 2dx); TFSF and point-like/ideal or tangential dipoles are exact. Round 3 on the immutable-Scene master ed6f1ce8f (rebased; the fix, scene builders, tests and evidence harness 