note = "Distributed FDTD only. initialize_source_terms ends with prepare_source_gathers, which builds a prepared gather for every periodic/Bloch patch term; the multi-GPU shard build then crops terms to each rank's owned x range (distributed/sources.py _crop_term_to_owned_x, called at shard_engine.py:281) but copied the gather built for the uncropped patch. The periodic injection (cuda/backend.py _patch_source_gather) uses a prepared gather as is, so it read patch entries past the cropped payload (y_periodic interface case: entries 12-17 of a 12-entry patch, whatever the allocator left there) and routed the surviving planes one x cell low. Regression since 8964f220 (fixed-order source gathers, 2026-11-03); the crop dates from 5ff176fd. The crop now drops the gather and prepare_source_gathers rebuilds every eligible route from the cropped payloads and offsets. Symptom: test_interface_adjacent_ideal_ex_source_image_parity[y_periodic] failed only after other multi-GPU files (zeroed fresh memory hid it); the single-device side was bitwise unchanged, the distributed side carried a spurious 3x3 injection on rank 1 from step 1. Movers: distributed periodic/Bloch scenes whose source terms are ownership-cropped move from the history-dependent or misrouted value to the single-device reference (the seam-straddling uniform current differed by 4.84 abs before). No single-device mover: the crop is the only post-gather term mutation; on master the public single-GPU path (auto core and fdtd_core_path=False) of the same scene is torch.equal between a fresh process and one after the polluting files. Evidence: <evidence-root>/coordinator-20261106/twodev-bf95/diag (q1/q2/q3 compares, fix-*.out/xml)."

