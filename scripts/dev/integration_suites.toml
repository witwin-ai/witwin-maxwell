al differences (rtol 1e-2); prepare_run equals run bitwise (fixed-iteration GMRES, the direct solve is not bitwise repeatable run to run, about 1e-16, also on the parent); sigma_e at 0 matches a one-sided second-order difference (master: zero); MaterialRegion position converges to central differences as h shrinks (polarized 0.02 percent at h=1e-4). Forward: every path the parent can run is torch.equal to the branch (fixed-iteration GMRES dump), and bridge fields are torch.equal to the detached solve. Census: 1 feature_boundary, 2 modified_boundary, 2 identities retired as moved/modified; CONTRACT_GUARDS unchanged. Gates: CPU toml/import/integration_batch/guard_census/consumer_metadata rc=0, FDFD CPU set identical except the new file; GPU FDFD set 523 passed rc=0 (parent 488 passed, the 35 others are the new file); BITID 8 files 33/33 T0 both. All T0. Evidence: <evidence-root>/api070-20261108/p2b/.'

