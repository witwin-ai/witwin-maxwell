# subject "Merge <branch>" followed by ":" or its end),
# pytest = "none" | [node strings or mover tables], benchmark = "none" | [rows], note = "...".
# Legacy pytest node strings are treated as T2-approved. Typed movers use T0, T1 or T2:
# {node = "tests/example.py::test_field", tier = "T1", max_rel_diff = 1e-6} (no approval), or
# {node = "tests/example.py::test_field", tier = "T2", approval = "user approval reference"}.
# T0 needs no approval. T1 requires a finite nonnegative max_rel_diff; T2 requires non-empty approval.
# intended = true or discrete = true forces T2 regardless of numeric size, and requires approval.
# [[expected_movers]] pytest selectors may carry tier/max_rel_diff/intended/discrete (default tier T2).
