note = 'Dispersive media under polarized-family subpixel averaging (T2, user-approved 2026-11-11 in the validation coordinator session: option A; scope polarized + polarized_tensor + kottke_smooth; default kottke_edge unchanged; metal_sphere Drude benchmark regression accepted). Interface edges reconstructed eps_inf with the window rule while Debye/Lorentz/Sellmeier pole weights were node volume fractions averaged node to edge, so the dispersive part was blended arithmetically (Sellmeier sphere stalled at 3.3 percent extinction error vs Mie). New compiler/materials._compile_polarized_pole_edges (torch reference and accelerated setup): per Yee component the weight of structure i is f_i*s, f_i its edge-native arithmetic fraction, s=(K(eps_0)-K(eps_inf))/(A(eps_0)-A(eps_inf)); exact at both frequency limits, pole frequencies unchanged, Drude keeps f_i; graded/modulated/perturbation media and gradient modes (design densities, trainable geometry) keep volume weights. _compile_edge_component/_compile_kottke_edge_component take constituent_values. No CUDA, ABI, guard or mom/ change. Mie (polarized 3, 150/40 cycles) master -> branch extinction error: Sellmeier dx 6.25/3.125 mm 3.72/3.26 -> 4.19/1.17 percent (non-dispersive twin 4.55/0.71); Debye 1.42/0.84 -> 0.16/0.04; resonant Lorentz 36/19 -> 22/13; Drude sphere (metal_sphere material, log-derivative Mie) 10.5/7.4 -> 3.3/4.1 percent, RCS 0.217/0.136 -> 0.092/0.073 (dx 12.5 mm 2.1 -> 6.2 percent with far field 0.53 -> 0.39), so the cached-reference metal_sphere move (0.246 -> 0.258) is not a regression vs Mie. Frozen store: tests/support/frozen_oracles.py accepts a pin marked supersedes (existing keys only, whole gate scene directories, replaced files untouched) and gates.compare resolves scene directories through the manifest; superseding addendum addenda/dispersive-polarized (166 payloads, existing path forced + torch setup, row-12 procedure at 84a864ad7; controls dipole_vacuum, dielectric_slab, cpml_dense bitwise vs the