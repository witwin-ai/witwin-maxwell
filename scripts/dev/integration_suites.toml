note = '0.7.0 phase 7d (plan api-070-plan-20261108 phase 7, SceneModule bullet and W7 row 11): identity-keyed static compile cache. Design: new internal module witwin/maxwell/compiler/static_cache.py. The material compiler blends every bulk structure before any MaterialRegion, so the accumulator state after the structure loop (the static prefix) of each node sample (_compile_material_sample) and of each edge-component offset sample (_compile_edge_component, non-kottke paths) depends only on the structures, the grid and the sampling flags; both loops moved unchanged into closures passed to static_prefix(scene, key, compute). compile_material_model opens static_prefix_frame(scene, samples, eps_background, mu_background) around the compile. Admission (decided before compiling): material_regions declared; every structure static (no requires_grad tensor reachable from geometry/material/chart, no modulation); no conductivity capture; Python-number backgrounds; prepared structures are the declared objects or their recorded PML box/wrapper extrusions; payload bound S*N*(b*(24+P)+1) + 6*S*N*(3b+1) bytes (S = prod(samples), N nodes, b dtype bytes, P pole entries) <= FRAME_BYTES = 512 MiB, else stats not_admitted_bytes. Frame key: device with index, current CUDA stream, material dtype, inference-mode flag, x/y/z nodes/primal/half/dual float64 bytes, chart (is), declared structures (is, in order); domain and boundary compared with ==; sub-keys: site, component, sample counts and index, averaging, backgrounds, sampling flags; selection/constituent_values/modulation_quadrature calls are never cached. Safety: frames hold weak references to their structures (death marks the frame dead and frees its tensors from the GC callback without touching the table); every lookup compares a _State snapshot (attribute/list/mapping bindings by is, every reachable tensor and ndarray by content, one comparison per dtype/device), so in-place edits including .data and rebinding miss; owners are recorded by id only while reachable from live key structures, so no id reuse; prefixes are cloned on insert and on every hit (constant-zero sentinels re-created), so no caller can mutate the cache; at most MAX_FRAMES = 2, LRU by count and per-frame bytes, deterministic, never memory-pressure driven; on CUDA the bytes are device memory held across runs until eviction, structure death or STATIC_PREFIX_CACHE.clear() (FEATURE_LIST/CHANGELOG say so). One code path: no switch; the miss path runs the original arithmetic and returns its own tensors. PML memo: GEOMETRY_MEMO reuses _pml_contact_faces(scene, geometry) by geometry identity + _State snapshot + (device, dtype, x/y/z nodes bytes, physical domain range, 6 boundary face kinds), which is everything the function reads; warnings, surface-impedance skips, density prismatic checks and records stay per prepare; callers get fresh lists; trainable geometry never memoized; bounds (round 2): an entry dies with its geometry (weak-reference callback frees the snapshot and value and marks the entry; the next lookup purges it under the lock), at most GEOMETRY_ENTRIES = 4096 entries and GEOMETRY_BYTES = 64 MiB of snapshot contents, LRU by count and bytes, and a geometry whose snapshot exceeds GEOMETRY_ENTRY_BYTES = 8 MiB is not memoized; a dead static-prefix frame also drops its state snapshot. FDTDMaterialCache: kept unchanged with content keys (lead decision): content-equal implies a hit, so identity hits are a strict subset, and the plan row-11 condition is satisfied by content keys on an immutable scene; it refuses material_regions, the new cache admits only scenes with them; no public change, public_api.py unchanged. PCB declared-band per-frequency reuse: deferred to a post-0.7.0 follow-up branch (FDTDMaterialCache conductivity replay + equality test vs uncached), not a gate. Follow-ups: post-averaging spatial factorization of the prefix (region support window) for samples>1 on large grids; PCB reuse. Docs: SceneModule docstring,