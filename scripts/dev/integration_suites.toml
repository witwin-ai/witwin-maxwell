note = 'Maxwell side of the user-approved EMFC full-field datagen storage plan (E only, cropped to domain.bounds with the periodic/Bloch wrap plane; H derived by EMFC). (a) Result.fields guarantee documented (Result.fields docstring, docs/reference/fdtd-typed-results.md) and pinned by tests/fdtd/test_result_field_record.py: raw Yee volume-DFT phasors on the full grid incl. absorber layers (torch.equal to the accumulated sum times dt*f), FieldData.values a view of the stored tensor, float64 prepared nodes, wrap plane E[last] = bloch_phase * E[0]. Public additions (fdtd namespace / stats keys, CHANGELOG [Unreleased]): stats()[dft_window] is now the recorded window (none for every non-CW time plan; numbers unchanged) with the request under dft_window_requested; last_step_field_ratio (per frequency ||E^N|| / (2 sin(omega dt/2) ||sum w E e^(i omega t)||), decay metric); bloch_wavevector, bloch_phase; tfsf (snapped node indices, corrected H blocks); mw.fdtd.tfsf_h_mask(result); FieldData attrs field_time_offset_steps = 0.0. (c) E sample time label: the field after step m is weighted at m*dt (f36cdaf18 physical Yee labels), tested against a FieldTimeMonitor trace (and a dt/2-shifted control). (b) Memory: memory_snapshot attribution (64^3 grid, 1 frequency): after release_solver 31 MB of 38 MB were the prepared scene compiled material cache (accelerated setup); release_solver now clears it, 38.4 -> 7.4 MB in the EMFC acceptance script (7.0 MB = the 6.5 MB phasors); sweep phasors are finalised in place into one preallocated (F, ...) tensor per component in the out-of-place operation order (8 frequencies: peak 229 -> 198 MB; after release 83 -> 52 MB), out of place under autograd (adjoint seeds); accumulators are released with the solver (release_solver documented as the datagen idiom; the G1 store pins them after run, so run() keeps them). No CUDA, ABI, stepping.py or ports.py change; no mom/ edit; no new capability guard. (d) benchmark/datagen/scenes.py, DATAGEN-ONLY change