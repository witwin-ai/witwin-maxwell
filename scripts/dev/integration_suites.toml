note = "Ledger item pec (perf gate (c)): the core step graph omits PEC clamp launches that cannot change a value. The core E kernel already writes 0 on PEC tangential faces, so a clamp only matters when a later E writer touches a face cell. P1 drops the post-dispersion clamp when the post-source clamp ran and there is no electric dispersion or port phase. P2 drops the post-source clamp when no compiled source or TFSF electric patch destination intersects a PEC tangential face (metadata only; unknown layouts, periodic images, complex fields and auxiliary TFSF keep both clamps). The plan is fixed at graph build and recorded as CorePathRuntime.pec_clamp_plan. No kernel or ABI change (no v11 bump needed, since the kernel already zeroes the faces), and no stepping.py/ports.py hunks. All T0. Gates on ae0e372f vs master 2e8308d2, witwin.core 0.4.6 (core-cuda-pec-fuse-gates RUN.log sha256 f508c60bb717bac6): the eight bit-identity files pass; six-field hashes after the run are byte-equal to master on 128/256 pec, 128 none and 128 cpml_slab dipole/tfsf/soft rows (interior sources). test_pec_clamp_fusion covers the source-on-a-PEC-face scene (on_face: the dipole patch writes the wall, so P2 keeps the post-source clamp), an adjacent-to-wall dipole, one-sided PEC, PEC+CPML, Debye dispersion and Mur admission; fields, monitors and DFT accumulators are torch.equal to the historical two-clamp schedule for chunks 1/16/32 over three runs, plus the P1 refusal when an E writer sits between the two sites. The first run failed 19 cases on a test-helper bug (65-step CW scenes never opened the Hanning DFT window); the test-only fix uses SpectralSampler(window=\"none\") so spectra sample from step 0 on the same CW injection route. Rerun on 4463f790's tree (rerun-testfix RUN.log sha256 6f7a4542d32e0085, core_path.log db0601b073b781c3): test_pec_clamp_fusion 265 passed, tests/fdtd/core_path 591 passed. Timing, 3 interleaved rounds, spread at most 0.6%, ms/step master to branch: 128 pec 0.2528 to 0.2346 (-7.2%, level with 128 none 0.2339), 256 pec 1.9448 to 1.8624 (-4.2%); 128/256 none unchanged."

