ins provide compiled sources; routing expects AUTO; the analytic DFT sum uses physical post-update labels. Census retains all master reviews plus six branch new/changed raising sites. CPU-only qualification; CUDA gates remain pending. Preserve all newer W3/ADE fixtures; kerr_slab, kerr_slab_strong, tpa_slab, modulated_slab, modulated_slab_phase and graphene_sheet retain coefficient-storage checks and explicit CPU guard refusals, and stay outside the admitted core GPU gate list. test_modulated_phase_checkpoint_resume_bitwise moved to w3_modulation_two_omega (open topology); the eager magnetic-surface fallback of modulated_slab_phase is no longer covered by it. Guard and core path are mutually exclusive: the guard samples only on the existing eager loop, and every configuration that builds a guard state (52 of 72 enumerated: 30 real-field closed-transverse by the 'closed-transverse CPML (passivity guard)' blocker, 22 complex fixed-k by 'Bloch/complex fields') is refused by core_path_blockers, which explicit and automatic core admission share (test_guard_sampled_configurations_are_core_ineligible; the automatic branch adds fdtd_core_path='auto' to it when it rebases). Non-finite energy still raises in every topology (coordinator 2026-11-06; test_nonfinite_energy_fails_closed asserts it for complex fixed-k too, including after a growth warning). T2 movers under user decision D2 (complex fixed-k warns): tests/boundaries/cpml/test_auto_passivity.py::test_exponential_growth_trips (old: real and complex growth raise; new: real growth still raises, complex case moved to test_complex_fixed_k_growth_warns_once_with_measurements: one RuntimeWarning plus slope/stderr/window/step record); tests/boundaries/cpml/test_auto_passivity.py::test_resume_preserves_partial_window_and_trip_step (old: complex growth raises before/after resume; new: one RuntimeWarning per independent run and equal warning metadata); tests/boundaries/cpml/test_auto_passivity.py::test_upper_three_stderr_and_rising_endpoint_required (old: complex upper-bound growth raises; new: RuntimeWarning plus measured-bound metadata, non-rising endpoint still accepted). Full test census found no existing complex fixed-k GPU raise mover: the eps4 point-dipole slab remains a below-resolution control (2.1e-7/step); added CUDA warning/completion/metadata gate for the eps4 TM CW cell at 0.25 k0, 0.9 f0, resolution 160 (measured 8.2e-7/step). Real-field must-trip gates are unchanged. New CPU gates cover one warning, structured measurements, warned checkpoint round-trip and full Result/resume lifecycle. Resume schema 6 retained; passivity state adds warning=None or a slope/stderr/window/step record, required by exact-key preflight. Existing passivity_guard keys remain; passivity_guard_warning is added to Result metadata and solver statistics"

