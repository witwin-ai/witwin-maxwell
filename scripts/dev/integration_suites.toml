note = "v0.6.0 gate 7, TFSF auxiliary-line fusion (core path, opt-in; existing default path untouched). For admitted axis-aligned providers (plane_wave_ref_x_ez, plane_wave_axis_aligned) with no incident reference or the two-cell incident stencil, the core step graph replaces the H correction, aux-H, E correction and aux-E launches plus the incident-boundary torch ops (about 37 operations) with 3 CUDA launches: one two-cell boundary launch (separately rounded intrinsics, device-indexed step), then one H launch (correction plus aux-H line) and one E launch (correction plus aux-E line), on disjoint grids with the original gather, accumulation order and full prepared absorber profiles. The optional boundary fold into the H launch is gated by auxiliary_boundary_fold_plan and never admitted (the aux-H line reads the E ghost), so solver._core_tfsf_aux_boundary_folded is always false; wider stencils, oblique providers, missing batches and the private disable hook keep the historical route. Core ABI v10 -> v11 (rebuild only); no stepping.py, ports.py or excitation/ hunks. All T0, no movers: test_tfsf_aux_fusion compares fused vs the existing path and vs the unfused core route with torch.equal (fields, aux E/H/boundary H/clock, raw DFT, phasors, monitors; 6 signed axes, pulse/CW, reference on/off, K=1/16/32, 3 fused repeats each), and covers both sides of the correction gate (minimum sample index 2 = clear, 1 = not clear). Validated on A6000 sm_86 only. ACCEPTANCE (amended by USER DECISION 2026-11-06, relayed by coordinator via AskUserQuestion): the 128 TFSF row at least 3% faster than master and no regression on 256 or any other row (the original 128 AND 256 at least 3% is unreachable: at 256 Yee is 97.3% of the step and all remaining TFSF work is 37 us). Timing, GPU 1 under gpu1.lock, 4 interleaved rounds, median us/step master 3c2f286e -> branch 7b3b4a47 (per-round spread): 64 tfsf 99.5 -> 59.9 (-39.8%, -39.90..-39.84), 128 tfsf 334.5 -> 296.0 (-11.50%, -11.57..-11.42), 2