# Data only. Suites always run; components scope the full pytest selection.
# Selectors are pytest paths/node IDs; command suites use argv without an interpreter.
base_commit = "3dfbda86"
# Every first-parent merge since base_commit that touches witwin/ or benchmark/ needs one [[merge_declarations]]
# entry with exactly one of commit = "<sha prefix>" or branch = "<owner>/<branch>" (matched exactly against the merge
# subject "Merge <branch>" followed by ":" or its end),
# pytest = "none" | [node strings or mover tables], benchmark = "none" | [rows], note = "...".
# Legacy pytest node strings are treated as T2-approved. Typed movers use T0, T1 or T2:
# {node = "tests/example.py::test_field", tier = "T1", max_rel_diff = 1e-6} (no approval), or
# {node = "tests/example.py::test_field", tier = "T2", approval = "user approval reference"}.
# T0 needs no approval. T1 requires a finite nonnegative max_rel_diff; T2 requires non-empty approval.
# intended = true or discrete = true forces T2 regardless of numeric size, and requires approval.
# A merge admitted through a consumer-metadata feature-group receipt adds
# consumer_group_receipt = "docs/assessments/consumer-feature-groups/<group>/NNNN.json@<sha256>"
# (printed by scripts/dev/fdtd/consumer_metadata/issue_group_receipt.py).
# [[expected_movers]] pytest selectors may carry tier/max_rel_diff/intended/discrete (default tier T2).
# Planning refuses unlisted T1 (must list max_rel_diff) and undeclared T2 pytest movers.
# Fresh BITID receipts are checked by report too; failure annotations use expected_movers/known_failures.
require_merge_declarations = true

# tests/materials/compiler/test_subpixel_spec.py only matches this path inside a
