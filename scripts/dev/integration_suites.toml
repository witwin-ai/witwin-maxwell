rs readers) 33 passed 33 skipped 22 failed on both, all 22 test_fdfd_monitor_refusal Scene requires CUDA, 0 changed. GPU gpu0 slots memcap8both: own + FDFD typed/response/magnetic/local files 52 vs 69 passed rc=0, 0 changed, +17 added all passing; CUDA-required readers (monitor_refusal, pulse_dft, field_projection, 2 scattering files) 66 passed rc=0 on the branch. Head 3fa6a91b (construction-only unit check): CPU own + readers 74 passed 41 skipped 22 failed (the same CUDA-required monitor_refusal nodes). Evidence: <evidence-root>/api070-20261108/p6a-direction (cpu_base, cpu_branch, cpu_branch_r2, gpu_base, gpu_branch, gpu_branch_r2, nodediff_*.txt, runners).'

