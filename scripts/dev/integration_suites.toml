note = 'RFIC layered MoM round 1 (the RFIC MoM line owner prepares; the release coordinator merges). Approvals (A) D-P1 one-time evidence renewal, (B) consumer-metadata re-receipt and (C) the intended layered test changes: approval user, RFIC line owner session, 2026-11-09 (AskUserQuestion). Base master e14d5ca0; 32 commits 954ecac5..38695578 plus this declaration; witwin/ 65 files +2595/-485. Stack, oldest first. (1) PH1 dense memory (954ecac5, 5416e6e6, c1b90968): each frequency owns one complex128 [N,N] system and one complex64 workspace that holds packed P during assembly and then the in-place complex64 LU; sparse loop/tree basis; LayeredDenseOperator implements SurfaceOperatorProtocol; footprint 16N^2 + 8 max(N^2, F(F+1)) <= 24N^2 for F <= N, down from 16(12N^2 + F^2); precision policy unchanged; versus 74f2d6aa on eight pinned cases T1 (max relative S/Y move 4.1e-13, bound 1e-10), R6b plate T0. (2) GR1 gradients (1b44f5fb, fbd6807a, 3fa3f484, 79c4a3d1, 33618c50, a4f9f0a5): native layered adjoint dY = -X^T dZ X for LossyMetalMedium.conductivity, the roughness fields and PlanarPEC.physical_thickness (no dZ storage, fixed-order reductions, no floating-point atomics); fixed-input construction is pinned unchanged. (3) p2c input contract (95b0ae27, 7aa6e9f2, f3b6761a, cc7928ae, e8b35197, bdf12417, a6534bbb): compile_layered_scene refuses every declared input the layered solve does not apply, in one NotImplementedError; LumpedPort.current_surface is optional and compile_port_geometry raises TypeError for an FDTD field port without it; trainable Layer/HalfSpace fields are refused at construction; run() recompiles and refuses a scene changed after prepare(); metadata key thickness_modelled_geometrically; CPU-only hosts skip the CUDA tests. (4) S2a matrix_free (91bb9750, 81eedbb9, a8f4da54, 5db34db1, bc5ccf2e): LayeredSurfaceConfig(operator_backend="matrix_free") solves the equilibrated loop/tree system without N^2 storage (near pairs and local loss as a complex128 spar